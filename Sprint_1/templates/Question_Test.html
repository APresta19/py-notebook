<html>
<head>
    <title>PyNotebook</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1e1e2f;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        .grid-container {
            display: grid;

            /* 2 columns: left panel + main IDE */
            grid-template-columns: minmax(360px, 30%) minmax(0, 1fr);

            /* 2 rows: main content + quiz */
            grid-template-rows: minmax(0, 1fr) 320px;

            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* Lesson Panel (Top Left) */
        .lesson-panel {
            grid-column: 1;
            grid-row: 1;
            background-color: #2b2b3c;
            padding: 15px;
            border-radius: 8px;
        }

        /* IDE Panel (Main Center) */
        .ide-panel {
            grid-column: 2;
            grid-row: 1;
            background-color: #1e1e2f;
            border: 1px solid #333;
            border-radius: 8px;
            min-width: 0;
            min-height: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Quiz Panel (YOUR SECTION) */
        .quiz-panel {
            grid-column: 1 / span 2; /* spans across bottom */
            grid-row: 2;
            background-color: #2b2b3c;
            padding: 15px;
            border-radius: 8px;
            overflow-y: auto;
        }

        .ide-panel iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
        }

        .placeholder {
            color: #777;
            font-style: italic;
        }

        h2 {
            margin-top: 0;
        }

        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<div class="grid-container">

    <!-- Lesson Panel (NOT YOURS) -->
    <div class="lesson-panel">
        {% include 'Lessons.html' %}
    </div>

    <!-- IDE Panel (NOT YOURS) -->
    <div class="ide-panel">
        <iframe src="/render-compiler" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    <!-- Quiz Panel (YOUR RESPONSIBILITY) -->
    <div class="quiz-panel">

    <h2>Quiz</h2>

    <button onclick="generateQuestions()">Generate Questions</button>
    
    <div id="quiz-content">
        <p class="placeholder">Click the button to generate quiz questions based on the current lesson.</p>
    </div>
</div>

</div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='services/quizSocket.js') }}"></script>
</body>
</html>
